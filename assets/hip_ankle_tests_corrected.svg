<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720">
<rect width="1000" height="720" rx="36" fill="#eef7fc"/>
<text x="48" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#10243a">Hip &amp; Ankle Mobility — Level 15</text>
<text x="48" y="102" font-family="Arial,sans-serif" font-size="21" fill="#53697d">Two separate tests. Perform both sides.</text>
<!-- hip panels -->
<rect x="42" y="132" width="916" height="245" rx="24" fill="#fff" stroke="#b9d8ea" stroke-width="3"/>
<text x="68" y="170" font-family="Arial,sans-serif" font-size="25" font-weight="850" fill="#22b8ff">1  •  90/90 HIP TEST — LEFT AND RIGHT</text>
<text x="68" y="202" font-family="Arial,sans-serif" font-size="17" fill="#53697d">Same position mirrored. Both knees bent about 90°. Sit tall without forcing the range.</text>
<!-- left schematic -->
<circle cx="270" cy="255" r="25" fill="#efad84" stroke="#10243a" stroke-width="6"/>
<path d="M270 280 L270 322" stroke="#101b2d" stroke-width="30" stroke-linecap="round"/>
<path d="M268 320 L195 320 L150 345" stroke="#1677d2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M274 320 L345 320 L390 348" stroke="#1677d2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="195" y="364" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#159475">LEFT SIDE</text>
<text x="150" y="306" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#22b8ff">90°</text><text x="370" y="306" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#22b8ff">90°</text>
<!-- mirrored -->
<circle cx="730" cy="255" r="25" fill="#efad84" stroke="#10243a" stroke-width="6"/>
<path d="M730 280 L730 322" stroke="#101b2d" stroke-width="30" stroke-linecap="round"/>
<path d="M732 320 L805 320 L850 345" stroke="#1677d2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M726 320 L655 320 L610 348" stroke="#1677d2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="670" y="364" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#159475">RIGHT SIDE</text>
<text x="610" y="306" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#22b8ff">90°</text><text x="832" y="306" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#22b8ff">90°</text>
<!-- ankle panel -->
<rect x="42" y="402" width="916" height="270" rx="24" fill="#fff" stroke="#b9d8ea" stroke-width="3"/>
<text x="68" y="442" font-family="Arial,sans-serif" font-size="25" font-weight="850" fill="#22b8ff">2  •  KNEE-TO-WALL ANKLE TEST</text>
<text x="68" y="472" font-family="Arial,sans-serif" font-size="17" fill="#53697d">Start toes ≈10 cm from wall • heel stays flat • knee tracks over toes • test both ankles</text>
<!-- wall and foot -->
<line x1="810" y1="500" x2="810" y2="638" stroke="#10243a" stroke-width="10"/>
<line x1="405" y1="626" x2="815" y2="626" stroke="#8aa8bb" stroke-width="5"/>
<path d="M610 617 L715 617" stroke="#1677d2" stroke-width="27" stroke-linecap="round"/>
<circle cx="617" cy="617" r="12" fill="#159475"/>
<path d="M655 603 L705 525" stroke="#efad84" stroke-width="30" stroke-linecap="round"/>
<circle cx="710" cy="518" r="19" fill="#efad84" stroke="#10243a" stroke-width="5"/>
<path d="M710 518 Q760 508 804 520" stroke="#22b8ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#22b8ff"/></marker></defs>
<line x1="710" y1="654" x2="810" y2="654" stroke="#22b8ff" stroke-width="4"/>
<line x1="710" y1="645" x2="710" y2="663" stroke="#22b8ff" stroke-width="4"/><line x1="810" y1="645" x2="810" y2="663" stroke="#22b8ff" stroke-width="4"/>
<text x="733" y="646" font-family="Arial,sans-serif" font-size="20" font-weight="900" fill="#22b8ff">≈10 cm</text>
<text x="475" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="800" fill="#159475">HEEL FLAT ✓</text>
<text x="68" y="526" font-family="Arial,sans-serif" font-size="17" fill="#10243a">PASS</text>
<text x="68" y="554" font-family="Arial,sans-serif" font-size="17" fill="#53697d">Knee touches wall without heel lift, foot collapse, or loss of balance.</text>
<text x="68" y="586" font-family="Arial,sans-serif" font-size="17" fill="#53697d">If you cannot reach the wall, move the foot closer until you can; record that distance.</text>
</svg>
